server {
    # Both families: nginx's stock config listens on IPv6 too, and the official
    # entrypoint would have added this line had we not replaced its file. Without
    # it, anything resolving `localhost` to `::1` inside the container cannot connect.
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
